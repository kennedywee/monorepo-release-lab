# SQLite keeps local setup simple. DATABASE_PATH selects another file, which lets a
# preview or release candidate run with its own isolated database.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", "storage/development.sqlite3") %>

# The test database is erased and re-created by the test suite.
test:
  <<: *default
  database: storage/test.sqlite3

# In a container, mount /rails/storage as a persistent volume.
production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", "storage/production.sqlite3") %>
