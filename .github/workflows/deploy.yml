# Deploy: put an already-built release on a host. Always started by a person.
# Merging to master never runs this workflow. staging.yml deploys master to "staging".
#
# It deploys the artifacts attached to the GitHub Release for the tag. It never rebuilds.
# Only config.js changes per environment.
#
# The "apps" input chooses what to deploy. A person decides which apps a release changed;
# this workflow does not work that out. Apps left out stay on the tag they already run.
#
# Required setup (not done in this repository):
#   - GitHub environments "candidate" and "production". Give "production" required reviewers.
#     Without required reviewers, the approval gate below does not stop anything.
#   - Environment variables: DEPLOY_HOST, DEPLOY_USER, API_URL.
#     Optional: SERVER_PORT (default 3000), so several environments can share one host.
#   - Environment secret: DEPLOY_SSH_KEY.
#   - One host per environment, with Docker, /etc/release-lab/<environment>/server.env
#     (SECRET_KEY_BASE, CORS_ORIGINS),
#     and a web server that serves /srv/release-lab/<environment>/<app>/current.
# When the configuration is missing, the deploy jobs fail with "NOT DEPLOYED".
name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (for example v1.1.0 or v1.1.0-rc.1)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [candidate, production]
      apps:
        description: Apps to deploy, comma-separated (server, web, store, marketing, docs, support), or "all"
        required: true
        type: string
        default: all
      data_preparation:
        description: Manual data preparation required by this release (see RELEASE.md)
        required: true
        type: choice
        options: [not-required, completed-and-verified-on-production]
      data_preparation_record:
        description: Link to the runbook record (required when data preparation was done)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  TARGET: ${{ inputs.environment }}
  APPS: ${{ inputs.apps }}

jobs:
  plan:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.apps.outputs.server }}
      static: ${{ steps.apps.outputs.static }}
    steps:
      - name: Choose the apps
        id: apps
        run: |
          known="server web store marketing docs support"
          [ "$APPS" = all ] && APPS="${known// /,}"
          server=false; static=()
          for app in ${APPS//,/ }; do
            case " $known " in
              *" $app "*) ;;
              *) echo "::error::Unknown app: $app. Use: $known, or all."; exit 1 ;;
            esac
            if [ "$app" = server ]; then server=true; else static+=("$app"); fi
          done
          if [ "$server" = false ] && [ ${#static[@]} -eq 0 ]; then
            echo "::error::No apps chosen."
            exit 1
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "static=$(printf '%s\n' "${static[@]}" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"
      - name: Only stable tags go to production
        run: |
          if [ "$TARGET" = production ] && ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Production accepts only stable tags (vX.Y.Z). $TAG is not one."
            exit 1
          fi
      - name: Read the release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p release-manifest.json
          jq -e '.allBuildsSucceeded == true' release-manifest.json > /dev/null || {
            echo "::error::The manifest for $TAG does not show every build as successful."
            exit 1
          }
          {
            echo "## Deploy plan"
            echo "- Tag: $TAG"
            echo "- Commit: $(jq -r .commit release-manifest.json)"
            echo "- Environment: $TARGET"
            echo "- Apps: $APPS"
            echo "- Data preparation: ${{ inputs.data_preparation }} ${{ inputs.data_preparation_record }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Data preparation needs a record
        if: inputs.data_preparation != 'not-required' && inputs.data_preparation_record == ''
        run: |
          echo "::error::Data preparation was done. Link the runbook record before deploying."
          exit 1

  approve:
    # The approval gate. For "production", GitHub pauses here until a required reviewer
    # approves. Reviewers confirm the data preparation record and the candidate test results.
    name: Approval for ${{ inputs.environment }}
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - run: echo "Approved deployment of $TAG to $TARGET." >> "$GITHUB_STEP_SUMMARY"

  deploy-server:
    name: Deploy server
    needs: [plan, approve]
    if: needs.plan.outputs.server == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # Only the shared deploy actions are needed from the repository.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/deploy-server
        with:
          image: ghcr.io/${{ github.repository_owner }}/release-lab-server:${{ inputs.tag }}
          environment: ${{ inputs.environment }}
          label: ${{ inputs.tag }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          api-url: ${{ vars.API_URL }}
          port: ${{ vars.SERVER_PORT || '3000' }}

  deploy-static:
    # Uses the same artifact that was tested. Only config.js changes per environment.
    name: Deploy ${{ matrix.app }}
    # Runs after the server deploy succeeds, or right away when the server is not chosen.
    needs: [plan, approve, deploy-server]
    if: >-
      !cancelled() && needs.approve.result == 'success' && needs.plan.outputs.static != '[]' &&
      (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.static) }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - name: Download the released artifact
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ matrix.app }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$APP-$TAG.tar.gz" -D "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/site" && tar -xzf "$RUNNER_TEMP/$APP-$TAG.tar.gz" -C "$RUNNER_TEMP/site"
      - uses: ./.github/actions/deploy-static
        with:
          app: ${{ matrix.app }}
          site-dir: ${{ runner.temp }}/site
          environment: ${{ inputs.environment }}
          label: ${{ inputs.tag }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          api-url: ${{ vars.API_URL }}
