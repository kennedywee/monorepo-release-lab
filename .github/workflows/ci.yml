# PR CI: tests, contract checks, type checks, and builds for every app.
# It checks every API consumer on every run. It does not try to detect which apps a change affects.
# The release workflow calls this file (workflow_call) so a tag gets the same checks.
#
# Jobs are grouped by toolchain, not by app, so each job installs its dependencies once.
# Each check is a named step. If the js job fails, the failed step name tells you which app.
# Branch protection needs only the "CI passed" job.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server specs and contract compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/server
          bundler-cache: true
      - run: bin/rails db:test:prepare
      - name: Server specs (API + OpenAPI contract)
        run: bundle exec rspec
      # Compares this PR's contract with the contract in the last stable tag (vX.Y.Z, not -rc).
      # Installed mobile apps keep calling the API, so a breaking change needs a deliberate decision.
      # Add the label "breaking-api-change-approved" to a PR to report breaking changes without failing.
      - name: Contract compatibility with last stable release
        if: github.event_name == 'pull_request'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-api-change-approved') }}
        run: |
          stable_tag=$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | head -n1 || true)
          if [ -z "$stable_tag" ]; then
            echo "::notice::No stable tag exists yet. Nothing to compare."
            exit 0
          fi
          git show "$stable_tag:apps/server/openapi.yaml" > /tmp/stable-openapi.yaml
          fail_on=ERR
          if [ "$APPROVED" = "true" ]; then fail_on=""; fi
          echo "Comparing apps/server/openapi.yaml with $stable_tag"
          docker run --rm \
            -v /tmp/stable-openapi.yaml:/stable.yaml:ro \
            -v "$PWD/openapi.yaml:/proposed.yaml:ro" \
            tufin/oasdiff:v1.33.0 breaking /stable.yaml /proposed.yaml ${fail_on:+--fail-on $fail_on}

  js:
    name: Types and builds for every JavaScript app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run contract:types
      - name: Generated TypeScript types match openapi.yaml
        run: git diff --exit-code packages/api/src/schema.d.ts
      # Each consumer is type-checked against types generated from the contract in this commit.
      # The desktop app has no screens of its own. The web check covers its renderer.
      - name: Typecheck packages/api
        run: bun run --cwd packages/api typecheck
      - name: Typecheck web against the contract
        run: bun run --cwd apps/web typecheck
      - name: Typecheck store against the contract
        run: bun run --cwd apps/store typecheck
      - name: Typecheck mobile against the contract
        run: bun run --cwd apps/mobile typecheck
      - name: Build web
        run: bun run --cwd apps/web build
      - name: Build store
        run: bun run --cwd apps/store build
      - name: Build marketing
        run: bun run --cwd apps/marketing build
      - name: Build docs
        run: bun run --cwd apps/docs build
      - name: Build support
        run: bun run --cwd apps/support build
      - name: Export mobile JavaScript bundles
        run: bun run --cwd apps/mobile build
      - name: Package desktop app (Linux, unpacked)
        run: bun run --cwd apps/desktop pack

  server-image:
    name: Build server container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      # The GitHub Actions cache keeps the image layers between runs. When Gemfile.lock
      # does not change, the gems layer is reused. The image is checked, never pushed.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/server
          tags: release-lab-server:ci
          push: false
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image

  passed:
    # The one required status. It fails if any job above failed or was cancelled.
    name: CI passed
    if: always()
    needs: [server, js, server-image]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
